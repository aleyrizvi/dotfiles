# -------------------------------------------------
# Terminal Settings
# -------------------------------------------------
set -g default-terminal "screen-256color"
set -g terminal-overrides ',xterm-256color:RGB'
setw -g mode-keys vi
set -g set-clipboard on

# -------------------------------------------------
# Plugins
# -------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# -------------------------------------------------
# Status Bar with Git Info
# -------------------------------------------------
set -g status-interval 5
set -g status-right-length 200
set -g status-right "#[fg=#a89984]#(cd #{pane_current_path} && git branch --show-current 2>/dev/null | sed 's/^/ /' | sed 's/$/ /')#[fg=#fe8019]#(cd #{pane_current_path} && git status --porcelain 2>/dev/null | grep -c '^.[M]' | sed 's/0//' | sed 's/.*/M&/')#[fg=#b8bb26]#(cd #{pane_current_path} && git status --porcelain 2>/dev/null | grep -c '^??' | sed 's/0//' | sed 's/.*/+&/')#[fg=#fb4934]#(cd #{pane_current_path} && git status --porcelain 2>/dev/null | grep -c '^[ADM]' | sed 's/0//' | sed 's/.*/*&/')#[fg=#83a598]#(cd #{pane_current_path} && git status -b --porcelain 2>/dev/null | head -1 | grep -o 'ahead [0-9]*' | sed 's/ahead /↑/' | tr -d '\n'; git status -b --porcelain 2>/dev/null | head -1 | grep -o 'behind [0-9]*' | sed 's/behind /↓/') #[bg=#3c3836,fg=#504945,nobold,nounderscore,noitalics]#[bg=#504945,fg=#a89984] %Y-%m-%d  %H:%M #[bg=#504945,fg=#bdae93,nobold,noitalics,nounderscore]#[bg=#bdae93,fg=#3c3836] #h "

# -------------------------------------------------
# Enhanced Keybindings
# -------------------------------------------------

# Vim-style pane navigation (with default Ctrl-B prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + number to jump directly to windows 1-9
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Ctrl-Left / Ctrl-Right to cycle windows
bind -n C-Left previous-window
bind -n C-Right next-window

# Optional browser-like Alt+Left / Alt+Right for window cycling
bind -n M-Left previous-window
bind -n M-Right next-window

